# =============================================================================
# Reusable CI Workflow: Node.js Web Apps (React / Vite)
# =============================================================================
# Builds a Node.js web app into a Docker image with Buildx support
# and pushes to Google Artifact Registry.
#
# Usage from caller:
#   jobs:
#     dockerize:
#       uses: hoanganhnth/cicd.centralized-pipelines/.github/workflows/build-node.yml@main
#       with:
#         image_name: "delivery-web"
#         dockerfile: "./Dockerfile"
#         platform: "linux/amd64"
#       secrets: inherit
# =============================================================================

name: "CI: Build Node Web App"

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker image name (e.g. delivery-web)"
        required: false
        type: string
        default: ""
      service_name:
        description: "Fallback alias for image_name"
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "./Dockerfile"
      platform:
        description: "Target CPU architecture platform"
        required: false
        type: string
        default: "linux/amd64"
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      checkout_repo:
        description: "Repository to checkout"
        required: false
        type: string
        default: ""
      checkout_ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
    secrets:
      GCP_SA_KEY:
        required: true

env:
  PROJECT_ID: lithe-paratext-506208-s5
  GAR_LOCATION: asia-southeast1
  REPOSITORY: delivery-repo

jobs:
  build-and-push:
    name: "Dockerize ${{ inputs.image_name || inputs.service_name }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repo || github.repository }}
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platform }}
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ inputs.image_name || inputs.service_name }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ inputs.image_name || inputs.service_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
