# =============================================================================
# Reusable CI Workflow: Node.js Web Apps (React / Vite)
# =============================================================================
# Builds a Node.js web app into a Docker image (multi-stage: build + Nginx)
# and pushes to Google Artifact Registry.
#
# Usage from caller:
#   jobs:
#     build:
#       uses: hoanganhnth/cicd.centralized-pipelines/.github/workflows/build-node.yml@main
#       with:
#         service_name: delivery-web
#       secrets:
#         GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
# =============================================================================

name: "CI: Build Node Web App"

on:
  workflow_call:
    inputs:
      service_name:
        description: "Service/app name for Docker image (e.g. delivery-web)"
        required: true
        type: string
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      build_command:
        description: "Build command to run"
        required: false
        type: string
        default: "npm run build"
      dockerfile_path:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      checkout_repo:
        description: "Repository to checkout"
        required: false
        type: string
        default: ""
      checkout_ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
    secrets:
      GCP_SA_KEY:
        required: true

env:
  PROJECT_ID: lithe-paratext-506208-s5
  GAR_LOCATION: asia-southeast1
  REPOSITORY: delivery-repo

jobs:
  build-and-push:
    name: "Build & Push ${{ inputs.service_name }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repo || github.repository }}
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install Dependencies & Verify
        run: |
          npm ci
          # Run lint/type-check if available
          npm run lint --if-present
          npm run type-check --if-present

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build & Push Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ inputs.service_name }}"

          docker build \
            -t "${IMAGE_URI}:${IMAGE_TAG}" \
            -t "${IMAGE_URI}:latest" \
            -f "${{ inputs.dockerfile_path }}" .

          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"

          echo "✅ Pushed ${IMAGE_URI}:${IMAGE_TAG}"
