# =============================================================================
# Reusable CI Workflow: React Native App (Shipper App)
# =============================================================================
# Builds React Native app for Android/iOS.
#
# Usage from caller:
#   jobs:
#     build:
#       uses: hoanganhnth/cicd.centralized-pipelines/.github/workflows/build-react-native.yml@main
#       with:
#         app_name: shipper-app
#         node_version: "20"
#         build_mode: "debug"
# =============================================================================

name: "CI: Build React Native App"

on:
  workflow_call:
    inputs:
      app_name:
        description: "App identifier (e.g. shipper-app)"
        required: true
        type: string
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "20"
      java_version:
        description: "JDK version for Android build"
        required: false
        type: string
        default: "17"
      build_target:
        description: "Build target: android, ios"
        required: false
        type: string
        default: "android"
      build_mode:
        description: "Build mode: debug or release"
        required: false
        type: string
        default: "debug"
      checkout_repo:
        description: "Repository to checkout"
        required: false
        type: string
        default: ""
      checkout_ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

jobs:
  build:
    name: "Build RN (${{ inputs.build_target }})"
    runs-on: ${{ inputs.build_target == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repo || github.repository }}
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Prepare environment file
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install JS Dependencies
        run: npm ci

      - name: Run Verification / Lint / Typecheck
        run: |
          if npm run | grep -q "verify"; then
            npm run verify
          else
            npm run lint --if-present
            npm run type-check --if-present
          fi

      - name: Run Tests & Coverage
        run: |
          if npm run | grep -q "test:coverage"; then
            npm run test:coverage
          else
            npm test -- --ci --passWithNoTests || true
          fi

      # ---- Android Build ----
      - name: Set up JDK (Android)
        if: inputs.build_target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Decode Keystore (Android Release)
        if: inputs.build_target == 'android' && inputs.build_mode == 'release'
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          fi

      - name: Build Android Package
        if: inputs.build_target == 'android'
        run: |
          if [ "${{ inputs.build_mode }}" = "debug" ]; then
            npx react-native build-android --mode=debug
          else
            cd android && ./gradlew assembleRelease --no-daemon
          fi

      # ---- iOS Build ----
      - name: Install CocoaPods (iOS)
        if: inputs.build_target == 'ios'
        run: |
          cd ios && pod install --repo-update

      - name: Build iOS (Archive)
        if: inputs.build_target == 'ios'
        run: |
          cd ios
          xcodebuild -workspace *.xcworkspace \
            -scheme "${{ inputs.app_name }}" \
            -configuration Release \
            -archivePath build/${{ inputs.app_name }}.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO || true

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.app_name }}-${{ inputs.build_target }}-${{ inputs.build_mode }}-${{ github.sha }}"
          path: |
            coverage/**
            android/app/build/outputs/apk/**/*.apk
            ios/build/**/*.xcarchive
          if-no-files-found: ignore
          retention-days: 30
