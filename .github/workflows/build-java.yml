# =============================================================================
# Reusable CI Workflow: Java / Spring Boot Microservices
# =============================================================================
# Called by backend_delivery repo to build individual microservices.
# Builds the Maven project, packages a single service's boot jar,
# creates a Docker image, and pushes it to Google Artifact Registry.
#
# Usage from caller:
#   jobs:
#     build:
#       uses: hoanganhnth/cicd.centralized-pipelines/.github/workflows/build-java.yml@main
#       with:
#         service_name: api-gateway
#       secrets:
#         GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
# =============================================================================

name: "CI: Build Java Service"

on:
  workflow_call:
    inputs:
      service_name:
        description: "Service name (e.g. api-gateway, auth-service, order-service)"
        required: true
        type: string
      java_version:
        description: "JDK version"
        required: false
        type: string
        default: "17"
      checkout_repo:
        description: "Repository to checkout (owner/repo)"
        required: false
        type: string
        default: ""
      checkout_ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
      extra_maven_args:
        description: "Additional Maven arguments for packaging"
        required: false
        type: string
        default: ""
      dockerfile_path:
        description: "Path to Dockerfile (relative to repo root)"
        required: false
        type: string
        default: "Dockerfile"
    secrets:
      GCP_SA_KEY:
        required: true

env:
  PROJECT_ID: lithe-paratext-506208-s5
  GAR_LOCATION: asia-southeast1
  REPOSITORY: delivery-repo

jobs:
  build-and-push:
    name: "Build & Push ${{ inputs.service_name }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repo || github.repository }}
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Install Platform Dependencies (contracts, starters)
        run: |
          mvn -B -DskipTests install \
            -pl platform/delivery-platform-bom,platform/delivery-build-parent,platform/kafka-starter,observability-starter,runtime-platform-starter,platform/platform-http-blocking,identity-contracts,search-contracts,routing-contracts,delivery-contracts,order-contracts,clients/identity-client,clients/routing-client,auth-resource-server-starter

      - name: Package Service Jar
        run: |
          bash scripts/package-compose-services.sh ${{ inputs.service_name }} ${{ inputs.extra_maven_args }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build & Push Docker Image
        env:
          SERVICE: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Determine service boot path
          canonical="${SERVICE%-service}"
          if [ "$SERVICE" = "saga-orchestrator-service" ]; then
            canonical="dispatch"
          fi

          if [ -f "${canonical}/boot/pom.xml" ] && [ -d "${canonical}/boot/src" ]; then
            SERVICE_PATH="${canonical}/boot"
          elif [ -f "${SERVICE}/pom.xml" ] && [ -d "${SERVICE}/src" ]; then
            SERVICE_PATH="${SERVICE}"
          else
            SERVICE_PATH="${SERVICE}"
          fi

          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${SERVICE}"

          docker build \
            --build-arg SERVICE_PATH="${SERVICE_PATH}" \
            -t "${IMAGE_URI}:${IMAGE_TAG}" \
            -t "${IMAGE_URI}:latest" \
            -f "${{ inputs.dockerfile_path }}" .

          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"

          echo "✅ Pushed ${IMAGE_URI}:${IMAGE_TAG}"
