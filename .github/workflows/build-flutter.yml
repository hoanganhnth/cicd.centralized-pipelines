# =============================================================================
# Reusable CI Workflow: Flutter Mobile App
# =============================================================================
# Builds Flutter app (APK/IPA) and optionally creates build artifacts.
# Primarily used for delivery_app (customer app).
#
# Usage from caller:
#   jobs:
#     build:
#       uses: hoanganhnth/cicd.centralized-pipelines/.github/workflows/build-flutter.yml@main
#       with:
#         app_name: delivery-app
#         flutter_version: "3.32.8"
#         build_target: apk
#         build_args: "--debug --dart-define=API_BASE_URL=http://10.0.2.2:8079"
# =============================================================================

name: "CI: Build Flutter App"

on:
  workflow_call:
    inputs:
      app_name:
        description: "App identifier (e.g. delivery-app)"
        required: true
        type: string
      flutter_version:
        description: "Flutter SDK version"
        required: false
        type: string
        default: "3.32.8"
      build_target:
        description: "Build target: apk, appbundle, ios, web"
        required: false
        type: string
        default: "apk"
      build_args:
        description: "Extra flutter build arguments"
        required: false
        type: string
        default: "--debug"
      run_coverage:
        description: "Whether to run tests with coverage"
        required: false
        type: boolean
        default: true
      checkout_repo:
        description: "Repository to checkout"
        required: false
        type: string
        default: ""
      checkout_ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

jobs:
  build:
    name: "Build Flutter (${{ inputs.build_target }})"
    runs-on: ${{ inputs.build_target == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repo || github.repository }}
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Flutter ${{ inputs.flutter_version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Prepare environment file
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Analyzer
        run: flutter analyze

      - name: Run Tests
        run: |
          if [ "${{ inputs.run_coverage }}" = "true" ]; then
            flutter test --coverage || true
          else
            flutter test || true
          fi

      - name: Decode Keystore (Android Release)
        if: inputs.build_target == 'apk' || inputs.build_target == 'appbundle'
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
            cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
          fi

      - name: Build ${{ inputs.build_target }}
        run: |
          flutter build ${{ inputs.build_target }} ${{ inputs.build_args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.app_name }}-${{ inputs.build_target }}-${{ github.sha }}"
          path: |
            coverage/**
            build/app/outputs/**/*.apk
            build/app/outputs/**/*.aab
            build/ios/ipa/*.ipa
            build/web/
          if-no-files-found: ignore
          retention-days: 30
